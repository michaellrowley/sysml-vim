name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          install_root="$RUNNER_TEMP/sysml-vim"
          python -m venv "$install_root/venv"
          "$install_root/venv/bin/python" -m pip install --upgrade pip
          "$install_root/venv/bin/python" -m pip install -e '.[dev]'
          echo "SYSML_VIM_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "$install_root/venv/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y vim neovim graphviz
      - name: Install SysML language server
        run: |
          npm install \
            --prefix "$SYSML_VIM_INSTALL_ROOT/lsp" \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund \
            'git+https://github.com/daltskin/sysml-v2-lsp.git#main'
          echo "SYSML_LSP_SERVER=$SYSML_VIM_INSTALL_ROOT/lsp/node_modules/sysml-v2-lsp/dist/server/server.js" >> "$GITHUB_ENV"
      - name: Run backend tests
        run: |
          "$SYSML_VIM_INSTALL_ROOT/venv/bin/python" -m pytest -q
      - name: CLI smoke checks
        run: |
          "$SYSML_VIM_INSTALL_ROOT/venv/bin/sysml" health --path tests/fixtures/workspace
          "$SYSML_VIM_INSTALL_ROOT/venv/bin/sysml" check tests/fixtures/workspace || true
          "$SYSML_VIM_INSTALL_ROOT/venv/bin/sysml" view composition --path tests/fixtures/workspace --format dot > /tmp/view.dot
          "$SYSML_VIM_INSTALL_ROOT/venv/bin/sysml" view composition --path tests/fixtures/workspace --format svg > /tmp/view.svg
      - name: Vim smoke test
        run: vim -Nu NONE -n -es -S tests/vim_smoke.vim
      - name: Vim backend configuration smoke test
        run: vim -Nu NONE -n -es -S tests/vim_backend_config_smoke.vim
      - name: Vim language server smoke test
        run: vim -Nu NONE -n -es -S tests/vim_lsp_smoke.vim
      - name: Vim view refresh smoke test
        run: vim -Nu NONE -n -es -S tests/vim_view_smoke.vim
      - name: Neovim smoke test
        run: nvim --headless -u NONE -c "set rtp+=." -c "source plugin/sysml.vim" -c "if !exists(':SysmlCheck') | cquit 1 | endif" -c "qa"
      - name: Neovim backend configuration smoke test
        run: nvim --headless -u NONE -c "set rtp+=." -c "luafile tests/nvim_backend_config.lua" -c "qa"
